name: CI/CD Pipeline & SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Quét lỗi Backend bằng SonarCloud
  sonar-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Bắt buộc để SonarCloud đọc được lịch sử thay đổi
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Analyze Backend with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Biến này GitHub tự cấp
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.projectKey=hongtc08_VTea_Web_App -Dsonar.organization=hongtc08 -DskipTests

  # 2. Quét lỗi Frontend bằng SonarCloud
  sonar-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Analyze Frontend with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend

  # 3. Chạy thử Build Docker (Không Push)
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build mô phỏng môi trường Local
        run: docker compose build
