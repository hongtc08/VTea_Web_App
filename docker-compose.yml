name: vtea-webapp
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pos-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # target riêng cho container, không dùng chung với target trên Windows (tránh class cũ / khóa file)
      - /app/target
      # Giữ thư viện Maven giữa các lần chạy, không phải tải lại
      - maven_repo:/root/.m2
    # Báo "healthy" khi Spring Boot đã mở cổng 8080 (tức là đã start xong)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pos-frontend
    ports:
      - "3000:3000"
    depends_on:
      # Chờ backend start xong mới chạy frontend
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
  maven_repo:
