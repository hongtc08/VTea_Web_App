spring:
  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]
  application:
    name: vtea
  datasource:
    # Kết nối tới DB thông qua biến môi trường từ file .env
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # none: không để Hibernate tự động sửa schema DB
      # DB đã có sẵn bảng, để Hibernate tự sửa sẽ gây lỗi với foreign key
      ddl-auto: none
    show-sql: true
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION} # 1 ngày tính theo milliseconds
